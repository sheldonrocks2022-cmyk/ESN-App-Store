<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESN Website Builder</title><link rel="stylesheet" href="../shared.css"></head><body><header class="top"><button class="back" onclick="back()">‹</button><div><div class="title">ESN Website Builder</div><div class="sub">Creator Studio</div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Creator Studio</div><h1>Make a site right on your phone.</h1><p>Edit the content and theme, preview it instantly, save the project locally, and export a complete HTML file.</p></section><section class="grid two"><div class="card"><h3>Project</h3><label>Site title</label><input id="siteTitle"><label>Headline</label><input id="headline"><label>Description</label><textarea id="desc"></textarea><label>Accent</label><input id="accent" type="color" value="#7b83ff"><label>Style</label><select id="style"><option value="glass">Glass</option><option value="clean">Clean</option><option value="bold">Bold</option></select><div class="row" style="margin-top:14px"><button class="btn" onclick="saveProject()">Save</button><button class="btn alt" onclick="exportHTML()">Export HTML</button></div></div><div class="card"><h3>Live preview</h3><iframe id="preview" style="width:100%;height:430px;border:1px solid var(--line);border-radius:16px;background:white"></iframe></div></section></main><script src="../shared.js"></script><script>let p=load('builder.project',{title:'My ESN Site',headline:'Built with ESN',desc:'A premium site made from the ESN Website Builder.',accent:'#7b83ff',style:'glass'});siteTitle.value=p.title;headline.value=p.headline;desc.value=p.desc;accent.value=p.accent;style.value=p.style;function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function html(){let bg=style.value==='clean'?'#f5f6fb':style.value==='bold'?'#08090d':'linear-gradient(135deg,#090b14,#171b2f)',fg=style.value==='clean'?'#11131b':'#fff';return '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box;background:'+bg+';color:'+fg+';font-family:system-ui}main{max-width:760px;padding:36px;border-radius:28px;background:'+(style.value==='glass'?'#ffffff12':'transparent')+';border:1px solid #ffffff22}h1{font-size:clamp(42px,10vw,82px);line-height:.92;letter-spacing:-.06em;margin:10px 0}b{color:'+accent.value+'}p{font-size:18px;line-height:1.6;opacity:.8}</style><main><small>'+esc(siteTitle.value)+'</small><h1>'+esc(headline.value)+'</h1><b>ESN CREATED</b><p>'+esc(desc.value)+'</p></main>'}function render(){preview.srcdoc=html()}function saveProject(){p={title:siteTitle.value,headline:headline.value,desc:desc.value,accent:accent.value,style:style.value};save('builder.project',p);toast('Project saved')}function exportHTML(){let b=new Blob([html()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(siteTitle.value||'esn-site').replace(/[^a-z0-9]+/gi,'-')+'.html';a.click();toast('HTML exported')}[siteTitle,headline,desc,accent,style].forEach(x=>x.oninput=render);render();</script></body></html>
