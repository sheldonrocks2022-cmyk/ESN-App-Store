<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESN Nexus</title><link rel="stylesheet" href="../shared.css"></head><body><header class="top"><button class="back" onclick="back()">‹</button><div><div class="title">ESN Nexus</div><div class="sub">Command center</div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Nexus</div><h1>Your ESN workspace.</h1><p>Launch ESN tools, keep a local project board, and store quick notes in one command center.</p></section><section class="section"><h2>Quick launch</h2><div class="grid"><div class="card"><h3>🛡️ Guardian</h3><button class="btn" onclick="location.href='../guardian/index.html'">Open</button></div><div class="card"><h3>⛏️ SMP</h3><button class="btn" onclick="location.href='../smp/index.html'">Open</button></div><div class="card"><h3>✨ Builder</h3><button class="btn" onclick="location.href='../builder/index.html'">Open</button></div></div></section><section class="grid two"><div class="card"><div class="row between"><h3>Project board</h3><button class="btn alt" onclick="addTask()">+ Task</button></div><div class="list" id="tasks"></div></div><div class="card"><h3>Quick notes</h3><textarea id="note" placeholder="Ideas, links, build notes..."></textarea><button class="btn" style="margin-top:10px" onclick="saveNote()">Save notes</button></div></section></main><script src="../shared.js"></script><script>let n=load('nexus',{tasks:[],note:''});note.value=n.note;function render(){tasks.innerHTML=n.tasks.length?n.tasks.map((t,i)=>'<div class="item row between"><label class="switch"><input type="checkbox" '+(t.done?'checked':'')+' onchange="done('+i+',this.checked)"> <span style="'+(t.done?'text-decoration:line-through;opacity:.55':'')+'">'+t.text+'</span></label><button class="btn alt" onclick="removeTask('+i+')">×</button></div>').join(''):'<div class="item muted">No tasks yet.</div>'}function addTask(){let x=prompt('Task');if(!x)return;n.tasks.push({text:x,done:false});save('nexus',n);render()}function done(i,v){n.tasks[i].done=v;save('nexus',n);render()}function removeTask(i){n.tasks.splice(i,1);save('nexus',n);render()}function saveNote(){n.note=note.value;save('nexus',n);toast('Notes saved')}render();</script></body></html>
