<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESN CAM</title><link rel="stylesheet" href="../shared.css"></head><body><header class="top"><button class="back" onclick="back()">‹</button><div><div class="title">ESN CAM</div><div class="sub">Render Lab</div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Render Lab</div><h1>Build and capture a block scene.</h1><p>This device-side renderer gives ESN CAM a working visual lab now. A live Minecraft feed can replace the generated scene later.</p><div class="row"><button class="btn" onclick="regen()">Generate scene</button><button class="btn alt" onclick="capture()">Capture PNG</button></div></section><section class="grid two"><div class="card"><canvas id="cv" class="canvas" width="900" height="500"></canvas></div><div class="card"><h3>Camera controls</h3><label>Yaw</label><input id="yaw" type="range" min="0" max="360" value="35"><label>Zoom</label><input id="zoom" type="range" min="50" max="150" value="100"><label>World density</label><input id="density" type="range" min="20" max="120" value="55"><div class="notice" style="margin-top:14px">Live server connection: not configured. This renderer is fully local.</div><div class="list" id="telemetry"></div></div></section></main><script src="../shared.js"></script><script>let seed=Date.now()%100000,ctx=cv.getContext('2d');function rand(i){let x=Math.sin(i*12.9898+seed)*43758.5453;return x-Math.floor(x)}function draw(){let w=cv.width,h=cv.height;ctx.fillStyle='#07101a';ctx.fillRect(0,0,w,h);let z=+zoom.value/100,y=+yaw.value*Math.PI/180,n=+density.value;for(let i=0;i<n;i++){let rx=rand(i),ry=rand(i+999),rz=rand(i+333),x=(rx-.5)*760*z+450+Math.cos(y)*rz*90,yy=390-ry*260*z+Math.sin(y)*rz*55,s=(18+rz*42)*z,hue=90+Math.floor(rand(i+77)*110);ctx.fillStyle='hsl('+hue+' 55% '+(28+rz*25)+'%)';ctx.fillRect(x,yy,s,s);ctx.strokeStyle='#ffffff18';ctx.strokeRect(x,yy,s,s)}ctx.fillStyle='#ffffffaa';ctx.font='18px system-ui';ctx.fillText('ESN CAM • local render',22,32);telemetry.innerHTML='<div class="item">Blocks: <b>'+n+'</b></div><div class="item">Yaw: <b>'+yaw.value+'°</b></div><div class="item">Zoom: <b>'+zoom.value+'%</b></div>'}function regen(){seed=Math.floor(Math.random()*999999);draw();toast('Scene regenerated')}function capture(){let a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='ESN-CAM-'+Date.now()+'.png';a.click();toast('Capture created')}[yaw,zoom,density].forEach(x=>x.oninput=draw);draw();</script></body></html>
