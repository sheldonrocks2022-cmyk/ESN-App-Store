<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESN Status</title><link rel="stylesheet" href="../shared.css"></head><body><header class="top"><button class="back" onclick="back()">‹</button><div><div class="title">ESN Status</div><div class="sub">Reachability monitor</div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Utilities</div><h1>Check what responds.</h1><p>Add public HTTPS endpoints and run a device-side reachability check. This makes a real network request, but it is not a replacement for server-side uptime monitoring.</p><div class="row"><button class="btn" onclick="checkAll()">Check all</button><button class="btn alt" onclick="addService()">+ Add service</button></div></section><section class="grid"><div class="card"><div class="muted">Services</div><div class="big" id="count">0</div></div><div class="card"><div class="muted">Responding</div><div class="big ok" id="up">0</div></div><div class="card"><div class="muted">Last check</div><div class="big" style="font-size:16px" id="when">Never</div></div></section><section class="section"><div class="list" id="services"></div></section></main><script src="../shared.js"></script><script>let data=load('status.services',[{name:'ESN Website',url:'https://esnoffical.com',state:'unknown'},{name:'Discord',url:'https://discord.com',state:'unknown'}]);function render(){count.textContent=data.length;up.textContent=data.filter(x=>x.state==='online').length;services.innerHTML=data.map((s,i)=>'<div class="item row between"><div><b>'+s.name+'</b><div class="muted mono">'+s.url+'</div></div><div class="row"><span class="pill '+(s.state==='online'?'ok':s.state==='offline'?'badtext':'')+'">'+s.state+'</span><button class="btn alt" onclick="checkOne('+i+')">Check</button><button class="btn alt" onclick="del('+i+')">×</button></div></div>').join('')}async function ping(url){let c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{await fetch(url,{mode:'no-cors',cache:'no-store',signal:c.signal});clearTimeout(t);return'online'}catch(e){clearTimeout(t);return'offline'}}async function checkOne(i){data[i].state='checking';render();data[i].state=await ping(data[i].url);data[i].checked=fmtTime();save('status.services',data);when.textContent=data[i].checked;render()}async function checkAll(){when.textContent='Checking…';for(let i=0;i<data.length;i++)await checkOne(i);when.textContent=fmtTime();toast('Reachability check finished')}function addService(){let name=prompt('Service name');if(!name)return;let url=prompt('HTTPS URL');if(!url)return;if(!/^https:\/\//i.test(url))return alert('Use an https:// URL');data.push({name,url,state:'unknown'});save('status.services',data);render()}function del(i){data.splice(i,1);save('status.services',data);render()}render();</script></body></html>
